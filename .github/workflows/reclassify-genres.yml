name: Recategoriser les livres restes en Litterature

# Meme principe que resync-covers.yml : bouton manuel, execute depuis
# GitHub (acces Internet), utilise les memes secrets du depot.
on:
  workflow_dispatch:

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Recatégoriser les genres
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run genres:reclassify
