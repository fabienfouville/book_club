name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    name: Types, lint et build
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build doit réussir sans projet Supabase.
      # L'application bascule alors en mode démonstration.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build de production
        run: npm run build
